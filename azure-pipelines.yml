# PHP as Linux Web App on Azure
# Build, package and deploy your PHP project to Azure Linux Web App.
# Add steps that run tests and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/php

trigger:
- main

variables:
  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '6395106d-f606-4608-be10-1d3d5e46f714'

  # Web app name
  webAppName: 'stellersubscriptionapiprod'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

  # Environment name
  environmentName: 'stellersubscriptionapiprod'

  # Root folder under which your composer.json file is available.
  rootFolder: $(System.DefaultWorkingDirectory)

stages:
- stage: Build
  displayName: Build stage
  variables:
    phpVersion: '8.2'
  jobs:
  - job: BuildJob
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: php -version
      workingDirectory: $(rootFolder)
      displayName: 'Report Composer host runtime; tests use pinned PHP 8.2 container'

    - script: composer install --no-interaction --prefer-dist
      workingDirectory: $(rootFolder)
      displayName: 'Composer install'

    - script: bash deploy/test_claim_mysql.sh
      workingDirectory: $(rootFolder)
      displayName: 'Verify concurrent claims and rollback on isolated MySQL'

    - script: python3 -m unittest discover -s deploy -p 'test_production_dependencies.py'
      workingDirectory: $(rootFolder)
      displayName: 'Test production dependency verification'

    # Tests above use development tools; never ship those tools in the API package.
    - script: |
        set -eu
        composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        git diff --exit-code -- composer.lock
        python3 deploy/verify_production_dependencies.py
        composer audit --locked --no-dev --no-interaction
      workingDirectory: $(rootFolder)
      displayName: 'Install and verify production dependencies only'
      env:
        APPINSIGHTS_ENABLED: 'false'

    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(rootFolder)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      displayName: 'Upload package'
      artifact: drop

- stage: Deploy
  displayName: 'Deploy Web App'
  dependsOn: Build
  # Pull requests run validation only; deploy code after it reaches main.
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeploymentJob
    pool:
      vmImage: $(vmImageName)
    environment: $(environmentName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App : stellersubscriptionapiprod'
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(webAppName)
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip
              appType: webAppLinux
              startUpCommand: 'sh /home/site/wwwroot/deploy/startup.sh'
